name: Erkennungsqualität messen

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Anzahl Testbilder
        default: '300'
      ocr:
        description: Testbilder je Sprache für die Spracherkennung (0 = aus)
        default: '60'
      condition:
        description: Karten für den Test der Zustandsschätzung (0 = aus)
        default: '0'
      card:
        description: Kartenname für eine gezielte Sprachprüfung (leer = aus)
        default: ''
      learn:
        description: Eigene Scans für den Lerntest (0 = aus)
        default: '0'
      foil:
        description: Karten für den Test der Foil-Erkennung (0 = aus)
        default: '0'
      text:
        description: Testbilder für die Erkennung mit Text (0 = aus)
        default: '0'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/images
            public/models
          key: catalog-none
          restore-keys: catalog-
      - run: npm run catalog -- riftbound
      - run: npm run eval -- riftbound --samples ${{ inputs.samples }} --ocr ${{ inputs.ocr }} --learn ${{ inputs.learn }} --condition ${{ inputs.condition }} --foil ${{ inputs.foil }} --text ${{ inputs.text }} ${CARD:+--card "$CARD"}
        env:
          CARD: ${{ inputs.card }}
