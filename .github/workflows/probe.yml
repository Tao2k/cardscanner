name: Probe Promo-Sets (vorübergehend)
on:
  push:
    branches: [claude/project-thread-t4q7wl]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/probe-promos.ts
