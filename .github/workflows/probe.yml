name: Quellen prüfen (temporär)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          curl -sS -m 60 -A "$UA" https://playriftbound.com/en-us/card-gallery/ -o g.html
          python3 - <<'P'
          import re,json
          h=open('g.html').read()
          d=json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S).group(1))
          print('hreflangs', [x['locale'] for x in d['props']['pageProps']['page']['hreflangs']])
          lists=[]
          def walk(o,p):
              if isinstance(o,dict):
                  for k,v in o.items(): walk(v,p+'.'+k)
              elif isinstance(o,list):
                  if o and isinstance(o[0],dict): lists.append((len(o),p,o))
                  for i,v in enumerate(o[:3]): walk(v,p+f'[{i}]')
          walk(d,'')
          lists.sort(key=lambda x:-x[0])
          for n,p,o in lists[:6]: print(n,p,list(o[0].keys())[:30])
          n,p,o=lists[0]
          s=json.dumps(o[0])
          print('SAMPLE', s[:3500])
          print('VARIANT SAMPLES')
          for c in o:
              t=json.dumps(c)
              if 'signature' in t.lower() or 'overnumber' in t.lower() or 'alternate' in t.lower():
                  print(t[:1500]); break
          P
