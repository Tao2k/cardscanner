name: Katalog bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # Montags 04:00 UTC: neue Karten und Sets übernehmen
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Referenzbilder und Modell aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: |
            .cache/images
            public/models
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-
      - name: Riftbound-Katalog bauen
        run: npm run catalog -- riftbound
      - name: App bauen
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
