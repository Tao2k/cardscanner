name: Katalog bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # Täglich 04:00 UTC: Cardmarket-Preise (Preisguide kommt gegen 01:00 UTC), neue Karten und Sets
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  # write: Preisverlauf im Zweig price-history fortschreiben
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Referenzbilder und Modell aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: |
            .cache/images
            public/models
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-
      - name: Riftbound-Katalog bauen
        run: npm run catalog -- riftbound
      - name: Cardmarket-Preise holen
        # Fällt die Preisquelle aus, erscheint die App trotzdem, nur ohne Preise.
        continue-on-error: true
        run: npm run prices -- riftbound
      - name: Preisverlauf fortschreiben
        # Cardmarket kennt nur den heutigen Preis; der Verlauf liegt dauerhaft im Zweig price-history.
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin price-history > /dev/null; then
            git fetch --depth=1 origin price-history:price-history
            git worktree add .history price-history
          else
            [ $? -eq 2 ] || exit 1  # Zweig fehlt wirklich (nicht nur Netzfehler)
            git worktree add --detach .history
            git -C .history checkout --orphan price-history
            git -C .history rm -rf -q --ignore-unmatch .
          fi
          npm run price-history -- riftbound --history .history
          cd .history
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898273+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Preisstand $(date -u +%F)" || exit 0
          git push origin price-history
      - name: App bauen
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
