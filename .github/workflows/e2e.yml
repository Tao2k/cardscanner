name: Scannen mit Kamera-Attrappe testen

on:
  workflow_dispatch:
  # Arbeitszweige vor dem Veröffentlichen prüfen
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/images
            public/models
          key: catalog-none
          restore-keys: catalog-
      - run: npm run catalog -- riftbound
      - name: Cardmarket-Preise holen (Abdeckung steht im Log)
        continue-on-error: true
        run: npm run prices -- riftbound
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/e2e-scan.ts
        env:
          E2E_SHOTS: e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: e2e-shots
          if-no-files-found: ignore
