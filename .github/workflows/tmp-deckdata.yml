name: Kartendaten für Deckbau ansehen (vorübergehend)
on:
  push:
    branches: [claude/project-thread-rkoifm]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/tmp-deckdata.ts
